# Hackerboy — an Omarchy theme.
# Omarchy's stock "Hackerman" (near-black navy background, neon-green
# accent), but red, yellow, orange, blue, magenta and brown are real
# hues instead of more shades of green, so terminal text (eza/ls, git,
# syntax highlighting, TUIs) shows in colour.
# Background, foreground, accent, green and cyan are Hackerman's own.

mode = "dark"

accent = "#82FB9C"
selection = "#1f253a"
muted = "#2d3450"

background = "#0B0C16"
dark_background = "#080910"
darker_background = "#06060c"
lighter_background = "#151828"

foreground = "#ddf7ff"
dark_foreground = "#6a6e95"
light_foreground = "#b5c5db"
bright_foreground = "#ddf7ff"

hyprland_active_border = "rgba(26a269ee) rgba(2ec27eee) 45deg"

# --- full-hue ANSI palette (green and cyan unchanged from Hackerman) ---
red = "#ff5f7a"
yellow = "#f7d450"
orange = "#ffa057"
green = "#4fe88f"
cyan = "#7cf8f7"
blue = "#5c9dff"
magenta = "#c77dff"
brown = "#b08d57"

bright_red = "#ff8a9d"
bright_yellow = "#ffe88a"
bright_green = "#9cf7c2"
bright_cyan = "#d1fffe"
bright_blue = "#8fbcff"
bright_magenta = "#dba6ff"
